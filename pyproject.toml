[project]
name = "suisuicode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.80",
  "rich>=13",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6",
  "mcp>=1.0",
  "httpx>=0.27",
]

[project.scripts]
suisuicode = "suisuicode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suisuicode"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
